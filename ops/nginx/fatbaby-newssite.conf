# Nginx reverse proxy config for FatBaby newssite (:8082)
# Deploy to: /etc/nginx/sites-available/fatbaby-newssite
# Enable: ln -s /etc/nginx/sites-available/fatbaby-newssite /etc/nginx/sites-enabled/
#
# Handles:
#   - Static asset caching headers
#   - Proxy cache for GET requests (60s TTL)
#   - Rate limiting (burst 20, sustain 5 req/s per IP)
#   - Gzip compression
#   - Health check bypass
#   - Timeouts appropriate for SSE (/live/events)

proxy_cache_path /var/cache/nginx/fatbaby
    levels=1:2 keys_zone=fatbaby_cache:10m max_size=256m inactive=5m use_temp_path=off;

limit_req_zone $binary_remote_addr zone=fatbaby_rl:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=fatbaby_api_rl:10m rate=2r/s;

server {
    listen 80;
    server_name fatbaby.io www.fatbaby.io;  # change to your domain

    # Redirect HTTP → HTTPS in production; remove this block if terminating TLS elsewhere.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fatbaby.io www.fatbaby.io;

    # TLS — replace with your certs (Let's Encrypt recommended).
    ssl_certificate     /etc/ssl/certs/fatbaby.crt;
    ssl_certificate_key /etc/ssl/private/fatbaby.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    gzip on;
    gzip_types text/html text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # Health check: bypass cache + rate limit.
    location = /healthz {
        proxy_pass http://127.0.0.1:8082;
        access_log off;
    }

    # SSE endpoint: disable proxy buffering, long timeouts.
    location = /live/events {
        proxy_pass             http://127.0.0.1:8082;
        proxy_http_version     1.1;
        proxy_set_header       Connection '';
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
        limit_req              zone=fatbaby_rl burst=5 nodelay;
    }

    # API endpoints: tighter rate limit, no cache.
    location ~ ^/api/ {
        limit_req              zone=fatbaby_api_rl burst=10 nodelay;
        proxy_pass             http://127.0.0.1:8082;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     35s;
        add_header             Cache-Control "no-store";
    }

    # RSS feeds: short cache (2m), separate zone.
    location ~ \.xml$ {
        limit_req              zone=fatbaby_rl burst=20 nodelay;
        proxy_pass             http://127.0.0.1:8082;
        proxy_cache            fatbaby_cache;
        proxy_cache_valid      200 2m;
        proxy_cache_use_stale  error timeout updating;
        add_header             X-Cache-Status $upstream_cache_status;
    }

    # All other GET requests: proxy cache 60s.
    location / {
        limit_req              zone=fatbaby_rl burst=20 nodelay;
        proxy_pass             http://127.0.0.1:8082;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_http_version     1.1;
        proxy_set_header       Connection '';
        proxy_read_timeout     30s;

        # Cache GETs only; POST/PUT/DELETE bypass.
        proxy_cache            fatbaby_cache;
        proxy_cache_methods    GET HEAD;
        proxy_cache_valid      200 60s;
        proxy_cache_valid      404 10s;
        proxy_cache_bypass     $http_authorization $cookie_session;
        proxy_no_cache         $http_authorization $cookie_session;
        proxy_cache_use_stale  error timeout updating http_503;
        proxy_cache_lock       on;

        add_header             X-Cache-Status $upstream_cache_status;
        add_header             X-Frame-Options SAMEORIGIN;
        add_header             X-Content-Type-Options nosniff;
        add_header             Referrer-Policy strict-origin-when-cross-origin;
    }
}
