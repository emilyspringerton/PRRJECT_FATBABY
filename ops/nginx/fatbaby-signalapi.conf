# Nginx reverse proxy for signalapi (:9091)
# API-only service — JSON responses, no HTML pages.

proxy_cache_path /var/cache/nginx/signalapi
    levels=1:2 keys_zone=signalapi_cache:5m max_size=128m inactive=5m use_temp_path=off;

limit_req_zone $binary_remote_addr zone=signalapi_rl:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name api.fatbaby.io;

    ssl_certificate     /etc/ssl/certs/fatbaby.crt;
    ssl_certificate_key /etc/ssl/private/fatbaby.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types application/json;

    location = /healthz {
        proxy_pass http://127.0.0.1:9091;
        access_log off;
    }

    location / {
        limit_req          zone=signalapi_rl burst=30 nodelay;
        proxy_pass         http://127.0.0.1:9091;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache        signalapi_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid  200 60s;
        proxy_cache_valid  503 5s;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock   on;

        add_header         X-Cache-Status $upstream_cache_status;
        add_header         Access-Control-Allow-Origin "*";
        add_header         Access-Control-Allow-Methods "GET, OPTIONS";
    }
}
